# Dam Angler: the game (static files) and its API at angler.homeprojecthub.co.za.
# (angler-v2.homeprojecthub.co.za, the v2 test address, redirects here.)
# HTTPS comes from the Cloudflare Tunnel in front of this.

# Visitors all arrive via the tunnel (127.0.0.1); Cloudflare passes the real
# address, which the API uses to slow down password guessing per visitor.
map $http_cf_connecting_ip $angler_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name angler.homeprojecthub.co.za;

    root /home/nelius/online_app/dam-angler-v2;
    index index.html;

    # Only the game itself is public: never the server code, its secrets,
    # the git history, docs, tests or tools.
    location ~ ^/(\.|server/|node_modules/|docs/|test/|tools/|backups/|package(-lock)?\.json|CHANGELOG|CLAUDE) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $angler_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 512k;
    }

    # Game files: always check for a newer version (versionCheck.js).
    location ~* \.(js|css|html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name angler-v2.homeprojecthub.co.za;
    return 301 https://angler.homeprojecthub.co.za$request_uri;
}
